name: Sync fork from upstream (safe)

# 云端自动同步: 即使 Mac 关机也能让 Fork 跟上原作者更新。
# 策略: 仅快进(no force-push), 若上游改写历史(non-ff)则安全跳过, 绝不覆盖已有提交。
on:
  schedule:
    - cron: '0 */6 * * *'   # 每 6 小时
  workflow_dispatch:

permissions:
  contents: write   # 允许推送到本 Fork(仅推自己的 main, 不碰上游)

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork main (full history)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/Caho1/open-claude-ui.git
          git fetch upstream
          git fetch origin

      - name: Fast-forward to upstream (no force push)
        id: syncstep
        run: |
          UP=$(git rev-parse upstream/main)
          LOCAL=$(git rev-parse HEAD)
          echo "local=$LOCAL upstream=$UP"
          if [ "$UP" = "$LOCAL" ]; then
            echo "no change"; echo "status=unchanged" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # 仅当本地是上游祖先(线性可快进)才更新; 否则安全停止
          if git merge-base --is-ancestor HEAD upstream/main; then
            git merge --ff-only upstream/main
            echo "status=merged" >> "$GITHUB_OUTPUT"
            echo "merged_to=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          else
            echo "DIVERGED: upstream rewrote history. Skipping (no force push)."
            echo "status=diverged" >> "$GITHUB_OUTPUT"
            exit 0
          fi

      - name: Push to fork (fast-forward only, no force)
        run: |
          # 仅当上一步发生了合并才推送
          gh_status="${{ steps.syncstep.outputs.status }}"
          if [ "$gh_status" = "merged" ]; then
            git push origin main
            echo "Pushed fork main to $(git rev-parse HEAD)"
          else
            echo "No push performed (unchanged or diverged — fork left intact)"
          fi
